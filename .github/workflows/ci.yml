  #         uv run pyright subtitleflow

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=subtitleflow --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          slug: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          pr: ${{ github.event.pull_request.number }}
          commit: ${{ github.event.pull_request.head.sha || github.sha }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system bandit[toml] safety

      - name: Run bandit security checks
        run: |
          uv run bandit -r subtitleflow -f json -o bandit-report.json || true
          uv run bandit -r subtitleflow

      - name: Check for known security vulnerabilities
        run: |
          uv pip list --format=json | uv run safety check --stdin --json || true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[docs]"

      - name: Build documentation
        run: |
          uv run mkdocs build --strict

      - name: Check documentation links
        run: |
          uv run mkdocs build --strict --verbose

  tox:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install tox-uv
        run: |
          uv pip install --system tox-uv

      - name: Run tox for Python ${{ matrix.python-version }}
        run: |
          tox run -e py$(echo ${{ matrix.python-version }} | tr -d '.')
