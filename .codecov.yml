codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
        base: auto
        branches:
          - main
          - develop
        flags:
          unittests:
            target: 80%
            threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 1%
        flags:
          unittests:
            target: 80%
            threshold: 1%

comment:
  layout: "reach,diff,flags,tree,reach"
  behavior: default
  require_changes: no
  branches:
    - main
    - develop

flags:
  unittests:
    paths:
      - subtitleflow/

ignore:
  - "tests/"
  - "legacy/"
  - "docs/"
  - "scripts/"
  - "**/__pycache__/"
  - "**/__init__.py"
  - "**/conftest.py"
  - "subtitleflow/__main__.py"
