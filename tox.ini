[tox]
envlist = py{311,312,313,314,315},lint,typecheck
requires = tox-uv>=0.4.0
isolated_build = false

[testenv]
package = editable
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-mock>=3.11.0
commands =
    pytest --cov=subtitleflow --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -v

[testenv:lint]
deps =
    ruff>=0.1.0
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
deps =
    mypy>=1.5.0
    pyright>=1.1.0
commands =
    mypy subtitleflow
    pyright subtitleflow --pythonversion 3.11

[testenv:docs]
deps =
    mkdocs-material>=9.0.0
    mkdocstrings[python]>=0.24.0
commands =
    mkdocs build --strict
