site_name: Subs - AI-Powered Subtitle Translation
site_description: Professional subtitle translation and correction using local LLMs
site_author: Subs Team
site_url: https://github.com/jochemvangrondelle/subtitleflow

repo_name: jochemvangrondelle/subtitleflow
repo_url: https://github.com/jochemvangrondelle/subtitleflow
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - Grammar Correction: user-guide/grammar-correction.md
      - Single Language Translation: user-guide/single-translation.md
      - Multi-Language Translation: user-guide/multi-translation.md
      - Model Selection: user-guide/models.md
      - Troubleshooting: user-guide/troubleshooting.md
      - Advanced Features: user-guide/advanced.md
  - API Reference:
      - Models: api/models.md
      - Clients: api/clients.md
      - Services: api/services.md
      - Utilities: api/utils.md
      - CLI: api/cli.md
  - Development:
      - Architecture: development/architecture.md
      - Testing: development/testing.md
      - Contributing: development/contributing.md
  - Performance:
      - Batch Processing: performance/batch-processing.md
      - Parallelism: performance/parallelism.md
      - Optimization Tips: performance/optimization.md
